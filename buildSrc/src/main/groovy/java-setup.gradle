// Common setup for every subproject: repositories and a JDK toolchain.
// The default JDK comes from the `javaVersion` property in gradle.properties.
// A subproject can pick a different JDK with:
//
//     java {
//         toolchain {
//             languageVersion = JavaLanguageVersion.of(17)
//         }
//     }
//
// Gradle will use an installed JDK of that version (see `gradlew javaToolchains`).

plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion as int)
    }
}

// JDK 24+ warns when libraries use JNI/FFM; silence that when running on such a JDK.
// The flag is evaluated lazily so per-subproject toolchain overrides are respected.
tasks.withType(JavaExec).configureEach {
    jvmArgumentProviders.add({
        java.toolchain.languageVersion.get().asInt() >= 22 ? ['--enable-native-access=ALL-UNNAMED'] : []
    } as CommandLineArgumentProvider)
}
